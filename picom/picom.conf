backend = "glx";

# blur-method = "dual_kawase";
# blur-strength = 8;
# blur-background-rule = [
#   # "window_type = 'dock'",
#   # "window_type = 'desktop'",
#   # "class_g = 'slop'",
#   # "_GTK_FRAME_EXTENTS@:c",
#   "class_g = 'st-256color'",
#   "class_g = 'com.mitchellh.ghostty'",
# ];
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c",
];

opacity-rule = [
  "100:class_g = 'dwmsystray'",
  # "97:class_g != 'dwm'",
]

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.60;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
    "class_g = 'dwm'",          
    "class_g = 'dmenu'",          
    "class_g = 'dwmsystray'",  
    "class_g = 'Dunst'",      
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];
